# The required, no-opt-out merge gate. Fast, deterministic, no paid model calls.
# New third-party CI actions use reviewed commit SHAs. Existing tag references
# remain outside this focused lockfile-hardening slice.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + types + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pin the resolver to the version that generated uv.lock so CI reads the
          # lock identically to the box that wrote it (reproducibility, ADR 0001).
          version: "0.11.21"
          enable-cache: true
      - name: Install (frozen from uv.lock)
        # --locked fails loud if uv.lock has drifted from pyproject; uv provisions
        # the pinned Python 3.13 and installs the exact locked versions + dev extra.
        run: uv sync --locked --extra dev --python 3.13
      - name: Lint (ruff)
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Typecheck (mypy strict)
        run: uv run --no-sync mypy
      - name: Tests (pytest + coverage ratchet)
        run: uv run --no-sync pytest
      - name: Fixtures validate
        run: uv run --no-sync python scripts/validate_fixtures.py
      - name: Offline smoke
        run: uv run --no-sync python scripts/smoke.py

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build runtime image
        run: docker build --tag extract-api:ci .

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
