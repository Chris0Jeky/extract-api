# Build once per run; the published digest is the smoke, SBOM, scan and deploy subject.
# Fork PRs enter only the read-only local job and never log in or push.
name: image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  # Never cancel a main publish mid-way: a pushed but unattested sha can never deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/chris0jeky/extract-api

jobs:
  local-image:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build once and load locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: EXTRACT_API_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Chris0Jeky/extract-api
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.title=extract-api
      - name: Smoke the locally built image
        env:
          IMAGE_REF: ${{ env.IMAGE }}:sha-${{ github.sha }}
        run: python scripts/docker_persistence_smoke.py --image "$IMAGE_REF"

  published-image:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Only the immutable sha tag here; :main moves after the proof below.
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: EXTRACT_API_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Chris0Jeky/extract-api
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.title=extract-api
      - name: Pull and smoke the pushed digest
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE_REF"
          python scripts/docker_persistence_smoke.py --image "$IMAGE_REF"
      - name: Generate SPDX JSON for the pushed digest
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: image.spdx.json
          if-no-files-found: error
      - name: Record image identity
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SBOM_ARTIFACT: sbom-${{ github.sha }}
        run: |
          printf 'Pushed ref: `%s`\n\nDigest: `%s`\n\nSBOM artifact: `%s`\n' \
            "$IMAGE_REF" "$DIGEST" "$SBOM_ARTIFACT" >> "$GITHUB_STEP_SUMMARY"
      - name: Scan the pushed digest with Grype
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity-cutoff: critical
          only-fixed: true
          fail-build: true
          output-format: sarif
          output-file: image.sarif
      - name: Upload SARIF even when the scan fails
        if: always() && hashFiles('image.sarif') != ''
        uses: github/codeql-action/upload-sarif@d208ec71e39ae46397cbf6569bef8439b9aab974 # codeql-bundle-v2.27.2
        with:
          sarif_file: image.sarif
      # Only a successfully smoked and scanned digest earns deployable provenance.
      - name: Attest the proven image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Move the main tag to the proven digest
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:main" "$IMAGE_REF"
