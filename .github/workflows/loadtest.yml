name: fixture load measurements

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/load_test.py
      - .github/workflows/loadtest.yml

permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.profile.memory }} / ${{ matrix.latency_ms }} ms
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile:
          - memory: 512m
            cpus: "0.5"
          - memory: 1g
            cpus: "1"
        latency_ms: [2000, 8000]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.21"
      - name: Install locked load runner
        run: uv sync --locked --no-dev --python 3.13
      - name: Build local image
        run: docker build --tag extract-api:loadtest .
      - name: Measure fixture workload
        env:
          MEMORY: ${{ matrix.profile.memory }}
          CPUS: ${{ matrix.profile.cpus }}
          FIXTURE_LATENCY_MS: ${{ matrix.latency_ms }}
        run: |
          mkdir -p loadtest-results
          export FIXTURE_CANNED_TEXT
          FIXTURE_CANNED_TEXT=$(uv run --no-sync python -c 'from scripts.docker_persistence_smoke import _fixture_request; print(_fixture_request()[1])')
          # No EXTRACT_MAX_CONCURRENCY override: measure the documented default 40.
          docker run -d --name extract-loadtest \
            --memory "$MEMORY" --memory-swap "$MEMORY" --cpus "$CPUS" \
            -p 127.0.0.1:8200:8200 -v extract-loadtest-data:/data \
            -e LLM_PROVIDER_MODE=fixture -e FIXTURE_CANNED_TEXT -e FIXTURE_LATENCY_MS \
            extract-api:loadtest
          set +e
          uv run --no-sync python -c 'from scripts.docker_persistence_smoke import _wait_for_health; _wait_for_health(8200)'
          ready_status=$?
          if [ "$ready_status" -eq 0 ]; then
            uv run --no-sync python scripts/load_test.py --container extract-loadtest \
              --timeout 60 --out-dir loadtest-results
            load_status=$?
          else
            load_status=$ready_status
          fi
          export LOAD_STATUS="$load_status" READY_STATUS="$ready_status"
          # A killed process is evidence, so retain its state before failing a leg.
          docker inspect -f '{{.State.OOMKilled}}' extract-loadtest > loadtest-results/oom-killed.txt
          docker inspect extract-loadtest > loadtest-results/container-inspect.json
          docker logs extract-loadtest > loadtest-results/container.log 2>&1
          uv run --no-sync python - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          output = Path("loadtest-results")
          oom = (output / "oom-killed.txt").read_text().strip()
          profile = {
              "memory": os.environ["MEMORY"], "cpus": os.environ["CPUS"],
              "fixture_latency_ms": int(os.environ["FIXTURE_LATENCY_MS"]),
              "extract_max_concurrency": 40, "swap": "disabled",
              "platform": platform.platform(), "oom_killed": oom,
              "load_exit_code": int(os.environ["LOAD_STATUS"]),
              "ready_exit_code": int(os.environ["READY_STATUS"]),
          }
          (output / "profile.json").write_text(json.dumps(profile, indent=2) + "\n")
          with (output / "results.md").open("a") as summary:
              summary.write(f"\nMemory: {profile['memory']}; CPUs: {profile['cpus']}; "
                            f"fixture latency: {profile['fixture_latency_ms']} ms; cap: 40; "
                            f"OOM killed: {oom}; load exit: {profile['load_exit_code']}.\n")
          PY
          echo "LOAD_STATUS=$load_status" >> "$GITHUB_ENV"
          exit 0
      - name: Append measurement table
        if: always()
        env:
          MEMORY: ${{ matrix.profile.memory }}
          FIXTURE_LATENCY_MS: ${{ matrix.latency_ms }}
        run: |
          echo "### $MEMORY / $FIXTURE_LATENCY_MS ms" >> "$GITHUB_STEP_SUMMARY"
          if [ -f loadtest-results/results.md ]; then
            cat loadtest-results/results.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No load table was produced; inspect the job logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: loadtest-${{ matrix.profile.memory }}-${{ matrix.latency_ms }}ms
          path: loadtest-results/
      - name: Stop measured container
        if: always()
        run: docker rm -f extract-loadtest || true
      - name: Report load failures after retaining results
        if: env.LOAD_STATUS != '' && env.LOAD_STATUS != '0'
        run: exit 1
