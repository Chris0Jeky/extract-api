version: 2
updates:
  # uv (not pip): updates pyproject ranges AND uv.lock together, so a dependency
  # bump keeps the frozen CI install (uv sync --locked) green. A pip-ecosystem bump
  # would touch only pyproject and leave the lock drifted, failing CI.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5

  # docker: keeps the digest pins on the uv and python base images in Dockerfile current.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    # pyproject's requires-python <3.14 ceiling (ADR 0001): a newer python tag cannot
    # build, and offering it crowds out the 3.13 digest refreshes that carry CVE fixes.
    ignore:
      - dependency-name: python
        versions: [">=3.14"]
    commit-message:
      prefix: deps(docker)

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-all:
        update-types: [major, minor, patch]
    commit-message:
      prefix: deps(actions)
