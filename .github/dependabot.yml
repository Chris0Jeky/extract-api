version: 2
updates:
  # uv (not pip): updates pyproject ranges AND uv.lock together, so a dependency
  # bump keeps the frozen CI install (uv sync --locked) green. A pip-ecosystem bump
  # would touch only pyproject and leave the lock drifted, failing CI.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-all:
        update-types: [major, minor, patch]
    commit-message:
      prefix: deps(actions)
